# AndromedaVideoCut de escritorio: Windows y Mac a la par desde el mismo commit/tag.
# - push a feat/mac o manual: compila ambos y sube los instaladores como artifacts.
# - tag v*: además crea la release como BORRADOR (draft). Publicarla es manual, con el OK de Wilhelm.
name: Desktop (Win + Mac)

on:
  push:
    branches: [feat/mac]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build web
        run: npm ci && npm run build
      - name: Deps de escritorio y FFmpeg
        working-directory: desktop
        run: npm ci && bash scripts/fetch-ffmpeg.sh win
      - name: Instalador NSIS x64
        working-directory: desktop
        run: npm run dist:win
      - name: Copia de nombre fijo para el website
        working-directory: desktop/dist
        run: cp AndromedaVideoCut-Setup-*-x64.exe AndromedaVideoCut-Setup-x64.exe && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build web
        run: npm ci && npm run build
      - name: Deps de escritorio y FFmpeg (arm64 + x64)
        working-directory: desktop
        run: npm ci && bash scripts/fetch-ffmpeg-mac.sh
      - name: dmg + zip (arm64 y x64), sin firma de Apple
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npm run dist:mac
      - name: Copias de nombre fijo para el website
        working-directory: desktop/dist
        run: |
          cp AndromedaVideoCut-*-mac-arm64.dmg AndromedaVideoCut-Mac-arm64.dmg
          cp AndromedaVideoCut-*-mac-x64.dmg AndromedaVideoCut-Mac-x64.dmg
          ls -la
      - name: Prueba de humo (arranca, carga el editor y cierra)
        working-directory: desktop/dist
        run: |
          APP=mac-arm64/AndromedaVideoCut.app
          codesign -dv "$APP" 2>&1 | head -5 || true
          AVC_SMOKE=1 "$APP/Contents/MacOS/AndromedaVideoCut" 2>&1 | tee smoke.log
          grep -q "AVC_SMOKE OK" smoke.log
          grep -q "ffmpeg: true" smoke.log
          "$APP/Contents/Resources/ffmpeg/ffmpeg" -hide_banner -version | head -1
          rm smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Release BORRADOR (nunca se publica sola)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V="${GITHUB_REF_NAME#v}"
          ls -la out
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "Beta $V" \
            --notes "Beta $V para Windows y Mac. Borrador: se publica a mano." out/*
